<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CMVideo — Local Upload Edition</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0d0e12;
            --card-bg: #161820;
            --accent-color: #e50914;
            --text-main: #f5f5f7;
            --text-secondary: #9ca3af;
            --border-color: #262936;
            --star-gold: #ffc107;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding-bottom: 20px;
        }

        /* Top Header Navigation */
        header {
            background: rgba(22, 24, 32, 0.95);
            backdrop-filter: blur(10px);
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid var(--border-color);
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .menu-btn {
            background: none;
            border: none;
            color: var(--text-main);
            font-size: 1.4rem;
            cursor: pointer;
            padding: 4px;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
        }

        .logo-svg {
            width: 32px;
            height: 32px;
        }

        .logo-text {
            font-size: 1.4rem;
            font-weight: 800;
            background: linear-gradient(45deg, #e50914, #ff5555);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Search Bar */
        .search-box {
            position: relative;
            margin: 12px 16px;
        }

        .search-box input {
            width: 100%;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 10px 16px 10px 38px;
            color: var(--text-main);
            outline: none;
            font-size: 0.95rem;
        }

        .search-box i {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-secondary);
        }

        /* Side Navigation Overlay Drawer */
        .drawer-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 200;
            display: none;
        }

        .side-drawer {
            position: fixed;
            top: 0;
            left: -280px;
            width: 280px;
            height: 100%;
            background: var(--card-bg);
            z-index: 201;
            transition: left 0.3s ease;
            display: flex;
            flex-direction: column;
            padding: 20px;
            border-right: 1px solid var(--border-color);
        }

        .side-drawer.open {
            left: 0;
        }

        .drawer-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
        }

        .drawer-menu {
            display: flex;
            flex-direction: column;
            gap: 10px;
            flex: 1;
        }

        .drawer-item {
            background: transparent;
            border: none;
            color: var(--text-main);
            font-size: 1.05rem;
            text-align: left;
            padding: 12px 16px;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .drawer-item.active, .drawer-item:hover {
            background: rgba(229, 9, 20, 0.15);
            color: var(--accent-color);
            font-weight: bold;
        }

        .admin-drawer-btn {
            margin-top: auto;
            background: #222533;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 12px;
            border-radius: 10px;
            font-size: 0.95rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        /* Main Content */
        main {
            padding: 0 16px;
            flex: 1;
        }

        .section-title {
            font-size: 1.2rem;
            margin: 10px 0 15px 0;
            border-left: 4px solid var(--accent-color);
            padding-left: 8px;
        }

        /* Media Grid 1:1 Aspect Ratio Cards */
        .media-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 12px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            cursor: pointer;
        }

        .card-img-wrap {
            position: relative;
            width: 100%;
            aspect-ratio: 1 / 1;
            overflow: hidden;
            background: #000;
        }

        .card-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .card-badge {
            position: absolute;
            top: 6px;
            right: 6px;
            background: rgba(0,0,0,0.8);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.7rem;
            font-weight: bold;
            color: var(--star-gold);
        }

        .card-type {
            position: absolute;
            top: 6px;
            left: 6px;
            background: var(--accent-color);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.65rem;
            font-weight: bold;
            text-transform: uppercase;
        }

        .card-info {
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .card-title {
            font-size: 0.9rem;
            font-weight: 700;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .card-desc {
            font-size: 0.75rem;
            color: var(--text-secondary);
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        /* Player & Modal View */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.95);
            z-index: 1000;
            overflow-y: auto;
        }

        .modal-content {
            width: 100%;
            min-height: 100%;
            background: var(--bg-color);
            display: flex;
            flex-direction: column;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
        }

        .video-container {
            width: 100%;
            background: #000;
            position: sticky;
            top: 0;
            z-index: 10;
            min-height: 220px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        video {
            width: 100%;
            height: 240px;
            display: block;
            border: none;
            background: #000;
        }

        .player-controls-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #111;
            padding: 8px 12px;
            font-size: 0.8rem;
            border-bottom: 1px solid var(--border-color);
        }

        .player-controls-bar select {
            background: var(--card-bg);
            color: #fff;
            border: 1px solid var(--border-color);
            padding: 4px 8px;
            border-radius: 6px;
        }

        .details-container {
            padding: 16px;
        }

        .details-title {
            font-size: 1.3rem;
            margin-bottom: 6px;
        }

        .details-meta {
            display: flex;
            gap: 10px;
            color: var(--text-secondary);
            font-size: 0.85rem;
            margin-bottom: 12px;
        }

        .details-desc {
            font-size: 0.9rem;
            line-height: 1.4;
            color: #ccc;
            margin-bottom: 20px;
        }

        /* Comments / Reviews Section */
        .reviews-section {
            border-top: 1px solid var(--border-color);
            padding-top: 16px;
        }

        .add-review-form {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 16px;
            background: var(--card-bg);
            padding: 12px;
            border-radius: 10px;
        }

        .star-rating {
            display: flex;
            gap: 6px;
            font-size: 1.3rem;
            color: #444;
            cursor: pointer;
        }

        .star-rating i.active {
            color: var(--star-gold);
        }

        .add-review-form textarea {
            width: 100%;
            background: #101117;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            border-radius: 8px;
            padding: 8px;
            height: 60px;
            font-size: 0.85rem;
            outline: none;
            resize: none;
        }

        .btn-submit {
            background: var(--accent-color);
            color: #fff;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            font-weight: bold;
            font-size: 0.85rem;
            align-self: flex-end;
            cursor: pointer;
        }

        .review-card {
            background: var(--card-bg);
            padding: 10px 12px;
            border-radius: 8px;
            margin-bottom: 10px;
            border-left: 3px solid var(--accent-color);
            position: relative;
        }

        .review-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
            font-size: 0.75rem;
            color: var(--text-secondary);
        }

        .btn-del-comment {
            background: none;
            border: none;
            color: #ff5555;
            font-size: 0.8rem;
            cursor: pointer;
            padding: 2px 4px;
            display: none;
        }

        .admin-logged .btn-del-comment {
            display: inline-block;
        }

        /* Admin Modal Styling */
        .admin-body {
            padding: 16px;
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-group label {
            display: block;
            font-size: 0.8rem;
            color: var(--text-secondary);
            margin-bottom: 4px;
        }

        .form-group input[type="text"], .form-group select, .form-group textarea, .form-group input[type="password"] {
            width: 100%;
            padding: 10px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: #fff;
            font-size: 0.9rem;
            outline: none;
        }

        .file-input-wrapper {
            background: var(--card-bg);
            border: 1px dashed var(--border-color);
            padding: 12px;
            border-radius: 8px;
            text-align: center;
        }

        .file-input-wrapper input[type="file"] {
            display: none;
        }

        .file-label {
            display: inline-block;
            color: var(--accent-color);
            font-size: 0.85rem;
            font-weight: bold;
            cursor: pointer;
        }

        .file-name-preview {
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-top: 4px;
        }

        .admin-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            background: var(--card-bg);
            border-radius: 8px;
            margin-bottom: 8px;
            font-size: 0.85rem;
        }

        .admin-actions {
            display: flex;
            gap: 6px;
        }

        .btn-edit {
            background: #1976d2;
            color: #fff;
            border: none;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            cursor: pointer;
        }

        .btn-delete {
            background: #d32f2f;
            color: #fff;
            border: none;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            cursor: pointer;
        }
    </style>
</head>

    <!-- IndexedDB Video Storage Script for Large Files -->
    <script>
        const DB_NAME = 'CMVideo_DB';
        const DB_VERSION = 1;
        const STORE_NAME = 'videos';
        let db = null;

        function initDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(DB_NAME, DB_VERSION);
                request.onupgradeneeded = (e) => {
                    const database = e.target.result;
                    if (!database.objectStoreNames.contains(STORE_NAME)) {
                        database.createObjectStore(STORE_NAME);
                    }
                };
                request.onsuccess = (e) => {
                    db = e.target.result;
                    resolve(db);
                };
                request.onerror = (e) => reject(e);
            });
        }

        function saveVideoBlob(id, blob) {
            return new Promise((resolve, reject) => {
                if (!db) return reject('DB not ready');
                const tx = db.transaction(STORE_NAME, 'readwrite');
                const store = tx.objectStore(STORE_NAME);
                store.put(blob, id);
                tx.oncomplete = () => resolve();
                tx.onerror = (e) => reject(e);
            });
        }

        function getVideoBlob(id) {
            return new Promise((resolve, reject) => {
                if (!db) return reject('DB not ready');
                const tx = db.transaction(STORE_NAME, 'readonly');
                const store = tx.objectStore(STORE_NAME);
                const req = store.get(id);
                req.onsuccess = () => resolve(req.result);
                req.onerror = (e) => reject(e);
            });
        }

        function deleteVideoBlob(id) {
            return new Promise((resolve) => {
                if (!db) return resolve();
                const tx = db.transaction(STORE_NAME, 'readwrite');
                const store = tx.objectStore(STORE_NAME);
                store.delete(id);
                tx.oncomplete = () => resolve();
            });
        }
    </script>

    <!-- Main Logic Script -->
    <script>
        const defaultData = [
            {
                id: 1,
                title: "Демо Мультфильм",
                type: "cartoon",
                posterUrl: "https://images.unsplash.com/photo-1534447677768-be436bb09401?w=500&auto=format&fit=crop",
                desc: "Тестовый ролик из галереи.",
                isNew: true,
                views: 100,
                reviews: [
                    { id: 101, rating: 5, text: "Всё отлично воспроизводится!", date: "01.11.2026" }
                ]
            }
        ];

        let mediaData = JSON.parse(localStorage.getItem('cmvideo_upload_meta')) || defaultData;
        let currentItem = null;
        let selectedRating = 5;
        let tempCoverBase64 = '';
        let selectedVideoFile = null;
        let activeBlobUrl = null;
        let isAdminLoggedIn = false;

        initDB().then(() => {
            renderGrid();
        }).catch(() => {
            renderGrid();
        });

        function saveData() {
            try {
                localStorage.setItem('cmvideo_upload_meta', JSON.stringify(mediaData));
            } catch(e) {
                alert('Ошибка сохранения параметров.');
            }
        }

        function toggleDrawer(open) {
            const drawer = document.getElementById('sideDrawer');
            const overlay = document.getElementById('drawerOverlay');
            if (open) {
                drawer.classList.add('open');
                overlay.style.display = 'block';
            } else {
                drawer.classList.remove('open');
                overlay.style.display = 'none';
            }
        }

        function selectCategory(cat, btn) {
            document.querySelectorAll('.drawer-item').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            toggleDrawer(false);

            const titles = {
                all: 'Все видео',
                movie: 'Фильмы',
                cartoon: 'Мультфильмы',
                popular: 'Популярное',
                new: 'Новинки'
            };
            document.getElementById('sectionTitle').innerText = titles[cat] || 'Все видео';
            renderGrid(cat, document.getElementById('searchInput').value);
        }

        function calculateAvgRating(reviews) {
            if (!reviews || reviews.length === 0) return 0;
            const sum = reviews.reduce((acc, r) => acc + r.rating, 0);
            return (sum / reviews.length).toFixed(1);
        }

        function renderGrid(filter = 'all', search = '') {
            const grid = document.getElementById('mediaGrid');
            grid.innerHTML = '';

            let list = mediaData.filter(item => {
                const matchesSearch = item.title.toLowerCase().includes(search.toLowerCase());
                if (!matchesSearch) return false;
                if (filter === 'all') return true;
                if (filter === 'movie') return item.type === 'movie';
                if (filter === 'cartoon') return item.type === 'cartoon';
                if (filter === 'new') return item.isNew;
                if (filter === 'popular') return item.views > 50;
                return true;
            });

            if (list.length === 0) {
                grid.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: #777; padding: 30px;">Ничего не найдено</p>';
                return;
            }

            list.forEach(item => {
                const avg = calculateAvgRating(item.reviews);
                const card = document.createElement('div');
                card.className = 'card';
                card.onclick = () => openPlayer(item.id);
                card.innerHTML = `
                    <div class="card-img-wrap">
                        <img class="card-img" src="${item.posterUrl}" onerror="this.src='https://via.placeholder.com/500?text=Обложка'">
                        <span class="card-type">${item.type === 'movie' ? 'Фильм' : 'Мульт'}</span>
                        <span class="card-badge"><i class="fas fa-star"></i> ${avg > 0 ? avg : 'Новый'}</span>
                    </div>
                    <div class="card-info">
                        <div class="card-title">${item.title}</div>
                        <div class="card-desc">${item.desc}</div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function handleSearch() {
            renderGrid('all', document.getElementById('searchInput').value);
        }

        /* Direct Player Engine for Phone Uploads */
        async function openPlayer(id) {
            currentItem = mediaData.find(m => m.id === id);
            if (!currentItem) return;

            currentItem.views += 1;
            saveData();

            const player = document.getElementById('mainPlayer');
            
            if (activeBlobUrl) {
                URL.revokeObjectURL(activeBlobUrl);
                activeBlobUrl = null;
            }

            try {
                const blob = await getVideoBlob(currentItem.id);
                if (blob) {
                    activeBlobUrl = URL.createObjectURL(blob);
                    player.src = activeBlobUrl;
                } else {
                    player.src = 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4';
                }
            } catch(e) {
                player.src = 'https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/BigBuckBunny.mp4';
            }

            document.getElementById('modalHeaderTitle').innerText = currentItem.title;
            document.getElementById('modalTitle').innerText = currentItem.title;
            document.getElementById('modalCategory').innerText = currentItem.type === 'movie' ? 'Фильм' : 'Мультфильм';
            document.getElementById('modalDesc').innerText = currentItem.desc;

            updateRatingDisplay();
            renderReviews();
            setRating(5);

            document.getElementById('playerModal').style.display = 'block';
            player.play().catch(() => {});
        }

        function closePlayer() {
            const player = document.getElementById('mainPlayer');
            player.pause();
            player.src = '';
            if (activeBlobUrl) {
                URL.revokeObjectURL(activeBlobUrl);
                activeBlobUrl = null;
            }
            document.getElementById('playerModal').style.display = 'none';
        }

        function changeSpeed(val) {
            const player = document.getElementById('mainPlayer');
            if (player) player.playbackRate = parseFloat(val);
        }

        /* Comments */
        function setRating(val) {
            selectedRating = val;
            const stars = document.querySelectorAll('#starRating i');
            stars.forEach((s, idx) => {
                s.className = idx < val ? 'fas fa-star active' : 'fas fa-star';
            });
        }

        function updateRatingDisplay() {
            const avg = calculateAvgRating(currentItem.reviews);
            document.getElementById('modalRating').innerHTML = `<i class="fas fa-star"></i> ${avg > 0 ? avg : '0.0'} (${currentItem.reviews ? currentItem.reviews.length : 0})`;
        }

        function submitReview() {
            const text = document.getElementById('reviewText').value.trim();
            if (!text) return alert('Введите текст комментария.');

            if (!currentItem.reviews) currentItem.reviews = [];
            currentItem.reviews.unshift({
                id: Date.now(),
                rating: selectedRating,
                text: text,
                date: new Date().toLocaleDateString('ru-RU')
            });

            saveData();
            document.getElementById('reviewText').value = '';
            renderReviews();
            updateRatingDisplay();
            renderGrid();
        }

        function deleteComment(commId) {
            if (!isAdminLoggedIn) {
                alert('Удалять отзывы может только администратор!');
                return;
            }
            if (confirm('Удалить этот комментарий?')) {
                currentItem.reviews = currentItem.reviews.filter(c => c.id !== commId);
                saveData();
                renderReviews();
                updateRatingDisplay();
                renderGrid();
            }
        }

        function renderReviews() {
            const container = document.getElementById('reviewsList');
            container.innerHTML = '';

            if (!currentItem.reviews || currentItem.reviews.length === 0) {
                container.innerHTML = '<p style="color: #666; font-size: 0.8rem;">Пока нет отзывов.</p>';
                return;
            }

            currentItem.reviews.forEach(r => {
                const el = document.createElement('div');
                el.className = 'review-card';
                let stars = '';
                for (let i = 1; i <= 5; i++) {
                    stars += `<i class="fas fa-star" style="color: ${i <= r.rating ? 'var(--star-gold)' : '#444'}"></i>`;
                }

                el.innerHTML = `
                    <div class="review-top">
                        <span>${stars} • ${r.date}</span>
                        <button class="btn-del-comment" onclick="deleteComment(${r.id})"><i class="fas fa-trash"></i> Удалить</button>
                    </div>
                    <div style="font-size: 0.85rem;">${r.text}</div>
                `;
                container.appendChild(el);
            });
        }

        /* Admin, File Selection & Direct Phone Processing */
        function openAdminModal() {
            document.getElementById('adminModal').style.display = 'block';
        }

        function closeAdmin() {
            document.getElementById('adminModal').style.display = 'none';
        }

        function verifyAdmin() {
            const input = document.getElementById('adminCodeInput').value;
            if (input === '2452_1726') {
                isAdminLoggedIn = true;
                document.getElementById('bodyRoot').classList.add('admin-logged');
                document.getElementById('adminAuth').style.display = 'none';
                document.getElementById('adminPanel').style.display = 'block';
                renderAdminMediaList();
            } else {
                alert('Неверный код доступа!');
            }
        }

        function handleCoverSelect(input) {
            const file = input.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                tempCoverBase64 = e.target.result;
                document.getElementById('coverFileName').innerText = file.name;
            };
            reader.readAsDataURL(file);
        }

        function handleVideoFileSelect(input) {
            const file = input.files[0];
            if (!file) return;
            selectedVideoFile = file;
            document.getElementById('videoFileName').innerText = file.name;
        }

        async function addOrUpdateMediaItem() {
            const editId = document.getElementById('editMediaId').value;
            const title = document.getElementById('addTitle').value.trim();
            const type = document.getElementById('addType').value;
            const desc = document.getElementById('addDesc').value.trim();

            if (!title) {
                alert('Пожалуйста, введите название!');
                return;
            }

            if (!editId && !selectedVideoFile) {
                alert('Пожалуйста, выберите видеофайл с телефона!');
                return;
            }

            let itemId = editId ? parseInt(editId) : Date.now();

            if (selectedVideoFile) {
                try {
                    await saveVideoBlob(itemId, selectedVideoFile);
                } catch(e) {
                    alert('Не удалось сохранить видеофайл на устройстве.');
                    return;
                }
            }

            if (editId) {
                const targetIndex = mediaData.findIndex(m => m.id == editId);
                if (targetIndex !== -1) {
                    mediaData[targetIndex].title = title;
                    mediaData[targetIndex].type = type;
                    mediaData[targetIndex].desc = desc || 'Без описания.';
                    if (tempCoverBase64) {
                        mediaData[targetIndex].posterUrl = tempCoverBase64;
                    }
                }
                alert('Элемент успешно обновлен!');
            } else {
                const newItem = {
                    id: itemId,
                    title: title,
                    type: type,
                    posterUrl: tempCoverBase64 || 'https://via.placeholder.com/500?text=Обложка',
                    desc: desc || 'Без описания.',
                    isNew: true,
                    views: 0,
                    reviews: []
                };
                mediaData.unshift(newItem);
                alert('Видео с телефона успешно добавлено в каталог!');
            }

            saveData();
            renderGrid();
            renderAdminMediaList();
            resetAdminForm();
        }

        function editMediaItem(id) {
            const item = mediaData.find(m => m.id === id);
            if (!item) return;

            document.getElementById('editMediaId').value = item.id;
            document.getElementById('addTitle').value = item.title;
            document.getElementById('addType').value = item.type;
            document.getElementById('addDesc').value = item.desc;
            
            document.getElementById('adminFormHeader').innerText = 'Редактировать контент';
            document.getElementById('btnSaveMedia').innerText = 'Сохранить изменения';
            document.getElementById('btnCancelEdit').style.display = 'block';
            document.getElementById('coverFileName').innerText = 'Оставьте пустым, чтобы не менять обложка';
            document.getElementById('videoFileName').innerText = 'Выберите новый файл или оставьте прежний';
            selectedVideoFile = null;
            tempCoverBase64 = '';
        }

        function resetAdminForm() {
            document.getElementById('editMediaId').value = '';
            document.getElementById('addTitle').value = '';
            document.getElementById('addDesc').value = '';
            document.getElementById('coverFileName').innerText = 'Файл не выбран (или останется прежним)';
            document.getElementById('videoFileName').innerText = 'Видеофайл не выбран';
            tempCoverBase64 = '';
            selectedVideoFile = null;

            document.getElementById('adminFormHeader').innerText = 'Добавить контент';
            document.getElementById('btnSaveMedia').innerText = 'Добавить в каталог';
            document.getElementById('btnCancelEdit').style.display = 'none';
        }

        async function deleteMediaItem(id) {
            if (confirm('Удалить этот элемент из каталога?')) {
                mediaData = mediaData.filter(m => m.id !== id);
                await deleteVideoBlob(id);
                saveData();
                renderGrid();
                renderAdminMediaList();
                resetAdminForm();
            }
        }

        function renderAdminMediaList() {
            const container = document.getElementById('adminMediaList');
            container.innerHTML = '';
            mediaData.forEach(m => {
                const el = document.createElement('div');
                el.className = 'admin-item';
                el.innerHTML = `
                    <span><strong>${m.title}</strong> (${m.type === 'movie' ? 'Фильм' : 'Мульт'})</span>
                    <div class="admin-actions">
                        <button class="btn-edit" onclick="editMediaItem(${m.id})">Редактировать</button>
                        <button class="btn-delete" onclick="deleteMediaItem(${m.id})">Удалить</button>
                    </div>
                `;
                container.appendChild(el);
            });
        }
    </script>
</body>
</html>
